name: LiteU
options:
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: UD7BN8R7P2
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  LiteU:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
    preBuildScripts:
      - name: Copy captcha HMAC key
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Secrets/captcha-hmac-key.txt
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/captcha-hmac-key.txt
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Secrets/captcha-hmac-key.txt"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/captcha-hmac-key.txt"
          if [ ! -f "$SRC" ]; then
            echo "error: 缺少 Secrets/captcha-hmac-key.txt" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$DST")"
          cp "$SRC" "$DST"
    entitlements:
      path: Sources/App/LiteU.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.liteu.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liteu.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LiteU
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于查找附近洗衣房
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LiteUWidget
  LiteUWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
    entitlements:
      path: Sources/Widget/LiteUWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.liteu.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liteu.app.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: LiteU
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  LiteUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liteu.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LiteU.app/LiteU"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: LiteU
schemes:
  LiteU:
    build:
      targets:
        LiteU: all
        LiteUWidget: all
        LiteUTests: [test]
    test:
      targets:
        - LiteUTests
